<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Anniversary 🎉</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap');
    
    :root {
      --neon-pink: #ff00ff;
      --neon-blue: #00ffff;
      --neon-green: #00ff00;
      --neon-purple: #9d00ff;
      --neon-yellow: #fff700;
      --neon-orange: #ff8c00;
    }
    
    body, html {
      height: 100%;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    }
    
    video#bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.7;
      mix-blend-mode: screen;
    }
    
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
      z-index: 0;
    }
    
    .content {
      position: relative;
      z-index: 2;
      top: 50%;
      transform: translateY(-50%);
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    
    h1 { 
      font-family: 'Pacifico', cursive;
      font-size: clamp(2rem, 5vw, 3.5rem); 
      margin-bottom: 0.5em;
      text-shadow: 0 0 10px var(--neon-pink), 
                   0 0 20px var(--neon-pink),
                   0 0 30px var(--neon-pink);
      animation: neonGlow 3s ease-in-out infinite alternate;
      color: #fff;
    }
    
    p { 
      font-size: clamp(1rem, 2.5vw, 1.5rem); 
      margin-bottom: 1.5em;
      text-shadow: 0 0 5px var(--neon-blue);
      color: #fff;
    }
    
    .input-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 2rem;
    }
    
    input {
      padding: 12px 15px;
      margin: 0 auto;
      width: 90%;
      max-width: 400px;
      border-radius: 25px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    
    input:focus {
      outline: none;
      border-color: var(--neon-blue);
      box-shadow: 0 0 15px var(--neon-blue);
    }
    
    input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    
    .btn-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 1.5rem;
    }
    
    .btn {
      margin: 0;
      cursor: pointer;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid;
      color: white;
      padding: 12px 25px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      min-width: 180px;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        to bottom right,
        rgba(255,255,255,0.3),
        rgba(255,255,255,0)
      );
      transform: rotate(45deg);
      transition: all 0.5s ease;
      opacity: 0;
    }
    
    .btn:hover::before {
      animation: shine 1.5s;
    }
    
    .music-control {
      border-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
    }
    
    .music-control:hover {
      background: rgba(0, 255, 0, 0.1);
      box-shadow: 0 0 20px var(--neon-green);
    }
    
    .whatsapp-share {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 10px var(--neon-yellow);
    }
    
    .whatsapp-share:hover {
      background: rgba(255, 247, 0, 0.1);
      box-shadow: 0 0 20px var(--neon-yellow);
    }
    
    .update-btn {
      border-color: var(--neon-purple);
      box-shadow: 0 0 10px var(--neon-purple);
    }
    
    .update-btn:hover {
      background: rgba(157, 0, 255, 0.1);
      box-shadow: 0 0 20px var(--neon-purple);
    }
    
    .neon-icon {
      filter: drop-shadow(0 0 5px currentColor);
      transition: all 0.3s ease;
    }
    
    canvas#fireworks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    
    .heart {
      position: absolute;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
      filter: drop-shadow(0 0 5px var(--neon-pink));
      opacity: 0.8;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    
    @keyframes neonGlow {
      0%, 100% {
        text-shadow: 0 0 10px var(--neon-pink), 
                     0 0 20px var(--neon-pink),
                     0 0 30px var(--neon-pink);
      }
      25% {
        text-shadow: 0 0 10px var(--neon-blue), 
                     0 0 20px var(--neon-blue),
                     0 0 30px var(--neon-blue);
      }
      50% {
        text-shadow: 0 0 10px var(--neon-green), 
                     0 0 20px var(--neon-green),
                     0 0 30px var(--neon-green);
      }
      75% {
        text-shadow: 0 0 10px var(--neon-purple), 
                     0 0 20px var(--neon-purple),
                     0 0 30px var(--neon-purple);
      }
    }
    
    @keyframes shine {
      0% { opacity: 0; transform: rotate(45deg) translate(-30%, -30%); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: rotate(45deg) translate(30%, 30%); }
    }
    
    @media (max-width: 768px) {
      .content {
        padding: 15px;
      }
      
      .btn {
        padding: 10px 20px;
        min-width: 160px;
      }
      
      .btn-container {
        flex-direction: column;
        align-items: center;
      }
    }
    
    @media (max-width: 480px) {
      input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <video autoplay muted loop id="bgVideo">
    <source src="https://www.videvo.net/videvo_files/converted/2017_01/preview/170104_Fireworks_07_1080p.mp465611.webm" type="video/webm">
    Your browser does not support HTML5 video.
  </video>
  <div class="overlay"></div>

  <canvas id="fireworks"></canvas>

  <div class="content">
    <!-- Input area -->
    <div class="input-container">
      <input id="nameInput" placeholder="🎉 Couple's Names (e.g., Amit & Neha)" />
      <input id="msgInput" placeholder="✍️ Personal Message (e.g., Wishing you...)" />
      <button class="btn update-btn" onclick="updateContent()">
        <i class="fas fa-sync-alt neon-icon" style="color: var(--neon-purple);"></i> Update Message
      </button>
    </div>

    <!-- Display area -->
    <h1 id="nameDisplay">Amit & Neha's Anniversary! <i class="fas fa-heart" style="color: var(--neon-pink);"></i></h1>
    <p id="msgDisplay">Wishing you a lifetime of love and laughter together! <i class="fas fa-glass-cheers" style="color: var(--neon-yellow);"></i></p>

    <div class="btn-container">
      <button class="btn music-control" onclick="toggleMusic()">
        <i class="fas fa-music neon-icon" style="color: var(--neon-green);"></i> 
        <span class="music-text">Play Music</span>
      </button>
      <a id="whatsappShare" class="btn whatsapp-share" target="_blank">
        <i class="fab fa-whatsapp neon-icon" style="color: var(--neon-yellow);"></i> Share on WhatsApp
      </a>
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
    Your browser does not support the audio tag.
  </audio>

  <script>
    let isPlaying = false;
    const music = document.getElementById('bgMusic');
    const musicBtn = document.querySelector('.music-control');
    const musicText = document.querySelector('.music-text');

    function toggleMusic() {
      if (isPlaying) {
        music.pause();
        musicText.textContent = 'Play Music';
        musicBtn.querySelector('i').className = 'fas fa-music neon-icon';
      } else {
        music.play()
          .then(() => {
            musicText.textContent = 'Pause Music';
            musicBtn.querySelector('i').className = 'fas fa-pause neon-icon';
          })
          .catch(error => {
            console.log('Audio playback failed:', error);
            alert('Please interact with the page first to enable audio');
          });
      }
      isPlaying = !isPlaying;
      
      // Add pulse effect
      musicBtn.style.transform = 'scale(1.1)';
      setTimeout(() => {
        musicBtn.style.transform = '';
      }, 300);
    }

    function updateContent() {
      const name = document.getElementById('nameInput').value.trim() || "Amit & Neha";
      const msg = document.getElementById('msgInput').value.trim() || "Wishing you a lifetime of love and laughter together!";

      document.getElementById('nameDisplay').innerHTML = `${name}'s Anniversary! <i class="fas fa-heart" style="color: var(--neon-pink);"></i>`;
      document.getElementById('msgDisplay').innerHTML = `${msg} <i class="fas fa-glass-cheers" style="color: var(--neon-yellow);"></i>`;

      const shareText = `🎉 Celebrate love with ${name}! 💖\n"${msg}"\nCheck out our anniversary page: ${window.location.href}`;
      document.getElementById('whatsappShare').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
      
      // Add confirmation effect
      const btn = document.querySelector('.update-btn');
      btn.innerHTML = '<i class="fas fa-check neon-icon" style="color: var(--neon-green);"></i> Updated!';
      setTimeout(() => {
        btn.innerHTML = '<i class="fas fa-sync-alt neon-icon" style="color: var(--neon-purple);"></i> Update Message';
      }, 2000);
    }

    // Set initial WhatsApp link
    updateContent();
    
    // Create floating hearts
    function createHearts() {
      const colors = ['var(--neon-pink)', 'var(--neon-blue)', 'var(--neon-green)', 'var(--neon-purple)', 'var(--neon-yellow)'];
      
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '<i class="fas fa-heart"></i>';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = Math.random() * 100 + 'vh';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        heart.style.color = colors[Math.floor(Math.random() * colors.length)];
        heart.style.animationDuration = (Math.random() * 10 + 5) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        document.body.appendChild(heart);
      }
    }
    
    createHearts();
  </script>

  <!-- Enhanced Fireworks JS -->
  <script>
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const fireworks = [];
    const colors = [
      '#ff00ff', '#00ffff', '#00ff00', 
      '#9d00ff', '#fff700', '#ff8c00',
      '#ff1493', '#00bfff', '#7fff00'
    ];

    function randomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    class Firework {
      constructor() {
        this.reset();
      }
      
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height;
        this.targetY = Math.random() * canvas.height / 2;
        this.speed = 2 + Math.random() * 3;
        this.radius = 3;
        this.color = randomColor();
        this.particles = [];
        this.exploded = false;
      }
      
      explode() {
        const particleCount = 100 + Math.floor(Math.random() * 50);
        for (let i = 0; i < particleCount; i++) {
          const angle = Math.random() * 2 * Math.PI;
          const speed = Math.random() * 5 + 1;
          const size = Math.random() * 4 + 1;
          
          this.particles.push({
            x: this.x,
            y: this.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: size,
            color: this.color,
            life: 100 + Math.random() * 50,
            friction: 0.95 + Math.random() * 0.03,
            gravity: 0.1 + Math.random() * 0.1
          });
        }
        this.exploded = true;
      }
      
      update() {
        if (!this.exploded) {
          this.y -= this.speed;
          
          if (this.y <= this.targetY) {
            this.explode();
          }
          
          return true;
        } else {
          for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            
            p.vx *= p.friction;
            p.vy *= p.friction;
            p.vy += p.gravity;
            
            p.x += p.vx;
            p.y += p.vy;
            
            p.life--;
          }
          
          this.particles = this.particles.filter(p => p.life > 0);
          
          if (this.particles.length === 0) {
            this.reset();
            return false;
          }
          
          return true;
        }
      }
      
      draw() {
        if (!this.exploded) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
          ctx.fillStyle = this.color;
          ctx.fill();
          
          // Trail
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(this.x, this.y + 10);
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 1;
          ctx.stroke();
        } else {
          for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
            ctx.fillStyle = p.color;
            ctx.fill();
            
            // Glow effect
            const gradient = ctx.createRadialGradient(
              p.x, p.y, 0,
              p.x, p.y, p.radius * 3
            );
            gradient.addColorStop(0, p.color);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * 3, 0, 2 * Math.PI);
            ctx.fillStyle = gradient;
            ctx.fill();
          }
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      
      // Clear with semi-transparent for trail effect
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Add new fireworks randomly
      if (Math.random() < 0.05) {
        fireworks.push(new Firework());
      }
      
      // Update and draw fireworks
      for (let i = 0; i < fireworks.length; i++) {
        if (fireworks[i].update()) {
          fireworks[i].draw();
        } else {
          fireworks.splice(i, 1);
          i--;
        }
      }
    }
    
    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
    
    // Initial fireworks
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        fireworks.push(new Firework());
      }, i * 300);
    }
  </script>
</body>
</html>
